name: Feature request
description: Propose a behavior or an extension.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: input
    id: problem
    attributes:
      label: The problem
      description: What can you not do today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Design constraints
      description: The project keeps these constraints unless a change is discussed first.
      options:
        - label: This does not require a model call on the capture or recall hot path.
        - label: This does not require a new runtime dependency.
        - label: This does not make a derived layer authoritative.
        - label: This keeps unknown time, missing journals, and empty results distinguishable.
